name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and test (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      # No install scripts: nothing in the toolchain needs them.
      - run: npm ci --ignore-scripts

      - run: npm run format:check

      - run: npm run lint

      - run: npm run typecheck

      - run: npm test

      # The PM2 ecosystem and the remote deployment script, with stand-ins for pm2 and curl.
      - run: npm run test:deploy

      - name: Shellcheck the deployment script
        run: shellcheck --severity=warning deploy/*.sh

      - run: npm run build

      - run: npm run bundle

      # Starts the bundle that would be deployed, with a configuration that reaches no API.
      - run: npm run smoke
